name: build with GCC toolchains

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zerotier-magisk
        uses: actions/checkout@v4

      - name: Get latest ZeroTier release tag
        id: ztversion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # unauthenticated api.github.com is capped at 60 req/h per IP, which GitHub
          # runners hit constantly; an empty tag makes checkout fall back to the default
          # branch (dev), where rustybits/zeroidc does not exist. Fail loudly instead.
          tag=$(gh api repos/zerotier/ZeroTierOne/releases/latest --jq .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::could not resolve the latest ZeroTierOne release tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout ZeroTierOne
        uses: actions/checkout@v4
        with:
          repository: zerotier/ZeroTierOne
          ref: ${{ steps.ztversion.outputs.tag }}
          path: ZeroTierOne

      - id: commit
        uses: prompt/actions-commit-hash@v3

      - name: Prepare GCC Toolchain
        run: |
          sudo apt-get install -qqy gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-aarch64-linux-gnu g++-arm-linux-gnueabihf
          rustup target add aarch64-unknown-linux-gnu

          sudo dpkg --add-architecture arm64
          sudo mv /etc/apt/sources.list.d/ubuntu.sources /root/ubuntu.sources.bak
          sudo rm -rf /var/lib/apt/lists/*
          sudo mv build/sources.list /etc/apt/sources.list
          sudo apt-get update -qqy
          sudo apt-get install -qqy libssl-dev:arm64

      - name: Patch ZeroTier for Cross-Compile
        run: |
          pip3 install toml
          python3 build/patch.py

      - name: Build for AArch64
        run: |
          CC=aarch64-linux-gnu-gcc
          CXX=aarch64-linux-gnu-g++

          cd ZeroTierOne
          mv make-linux.mk.aarch64 make-linux.mk
          make clean
          make --silent -j $(nproc) ZT_SSO_SUPPORTED=0 ZT_STATIC=1 ZT_DEBUG=0 CC=$CC CXX=$CXX LDFLAGS="-s"
          cd ..

          cp ZeroTierOne/zerotier-one magisk/zerotier

      - name: Upload AArch64
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-magisk-aarch64-gcc-zt${{ steps.ztversion.outputs.tag }}-${{ steps.commit.outputs.short }}
          path: magisk/

      - name: Package AArch64 module zip
        run: |
          cd magisk
          zip -r ../zerotier-magisk-aarch64-gcc-${{ github.ref_name }}.zip .
          cd ..

      - name: Build for AArch64 with SSO
        run: |
          CC=aarch64-linux-gnu-gcc
          CXX=aarch64-linux-gnu-g++

          cd ZeroTierOne
          make clean
          make --silent -j $(nproc) ZT_STATIC=1 ZT_DEBUG=0 CC=$CC CXX=$CXX LDFLAGS="-s"
          cd ..

          cp ZeroTierOne/zerotier-one magisk/zerotier

      - name: Upload AArch64 SSO
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-magisk-aarch64-gcc-SSO-zt${{ steps.ztversion.outputs.tag }}-${{ steps.commit.outputs.short }}
          path: magisk/

      - name: Package AArch64 SSO module zip
        run: |
          cd magisk
          zip -r ../zerotier-magisk-aarch64-gcc-SSO-${{ github.ref_name }}.zip .
          cd ..

      - name: Build for Arm
        run: |
          CC=arm-linux-gnueabihf-gcc
          CXX=arm-linux-gnueabihf-g++
          FLAGS="-w -fcompare-debug-second"

          cd ZeroTierOne
          mv make-linux.mk.arm make-linux.mk
          make clean
          make --silent -j $(nproc) ZT_SSO_SUPPORTED=0 ZT_STATIC=1 ZT_DEBUG=0 CC=$CC CXX=$CXX LDFLAGS="-s"
          cd ..

          cp ZeroTierOne/zerotier-one magisk/zerotier/

      - name: Upload Arm
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-magisk-arm-gcc-zt${{ steps.ztversion.outputs.tag }}-${{ steps.commit.outputs.short }}
          path: magisk/

      - name: Package Arm module zip
        run: |
          cd magisk
          zip -r ../zerotier-magisk-arm-gcc-${{ github.ref_name }}.zip .
          cd ..

      - name: Upload module zips
        uses: actions/upload-artifact@v4
        with:
          name: gcc-release-assets
          path: zerotier-magisk-*.zip
