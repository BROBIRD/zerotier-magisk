name: build app

on:
  workflow_dispatch:
  push:
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zerotier-magisk
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21' 

      - name: build target apk
        run: |
          cd app
          flutter pub get
          flutter build apk

      - id: commit
        uses: prompt/actions-commit-hash@v3

      - name: Upload App release
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.commit.outputs.short }}
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Package APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk zerotier-magisk-app-${{ github.ref_name }}.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: zerotier-magisk-app-*.apk
